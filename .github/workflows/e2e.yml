name: E2E Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  PROPTEST_CASES: "10"
  RUST_BACKTRACE: "1"

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Every test step pipes into tee. GitHub's default shell has no pipefail, so
    # the pipe would report tee's status; an explicit `bash` shell turns it on.
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Run e2e tests
        run: cargo test --test e2e_state_machine -- --nocapture 2>&1 | tee e2e-output.log

      # The Actions v2 handlers make claims about payloads Zitadel sends that
      # only a running instance can settle, so this suite is the one place they
      # are checked against a real one.
      - name: Run action handler e2e tests
        # Runs even when the suite above fails, so that these two suites report
        # on each other's behalf rather than one hiding the other.
        if: always()
        run: cargo test --test e2e_actions -- --nocapture 2>&1 | tee -a e2e-output.log

      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-logs
          path: e2e-output.log
          retention-days: 7
